name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      faiss-key: ${{ steps.key.outputs.faiss }}
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopenblas-dev

      - name: Compute cache keys
        id: key
        env:
          SRC_HASH: ${{ hashFiles('mix.lock', 'c_src/**', 'Makefile') }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          FAISS_REV=$(sed -n 's/^FAISS_GIT_REV *?= *//p' Makefile | tr -d ' ')
          echo "value=${RUNNER_OS}-mix-${ELIXIR_VERSION}-${OTP_VERSION}-test-${SRC_HASH}-${FAISS_REV}" >> "$GITHUB_OUTPUT"
          echo "faiss=${RUNNER_OS}-faiss-${FAISS_REV}" >> "$GITHUB_OUTPUT"

      # FAISS source build (~10 min) is cached independently of the NIF/deps
      # so c_src/lib changes don't rebuild FAISS
      - name: Cache FAISS build
        uses: actions/cache@v5
        with:
          path: ~/.cache/faiss_ex
          key: ${{ steps.key.outputs.faiss }}

      - name: Cache deps & build
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.key.outputs.value }}

      - run: mix deps.get
        if: steps.cache.outputs.cache-hit != 'true'

      - run: mix compile --warnings-as-errors
        if: steps.cache.outputs.cache-hit != 'true'

  format:
    name: Formatting
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - run: mix format --check-formatted

  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopenblas-dev

      - uses: actions/cache/restore@v5
        with:
          path: ~/.cache/faiss_ex
          key: ${{ needs.setup.outputs.faiss-key }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix test --include slow

  # The Makefile carries a substantial darwin-only path — install_name_tool
  # @rpath/@loader_path rewriting, libomp hints, FAISS_ENABLE_MKL=OFF on
  # arm64 — that the ubuntu jobs never exercise. macos-14 is Apple Silicon,
  # which is the variant that has all of it. Self-contained rather than
  # folded into the setup/restore handoff above: that flow keys its cache on
  # runner.os and uses fail-on-cache-miss, so a second OS would have to
  # matrix the whole chain for no benefit.
  test-macos:
    name: Tests (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # cmake ships on the runner image; libomp does not, and the arm64
      # branch of the Makefile expects it under $(HOMEBREW_PREFIX)/opt/libomp.
      - name: Install build dependencies
        run: brew install libomp

      - name: Compute FAISS cache key
        id: key
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          FAISS_REV=$(sed -n 's/^FAISS_GIT_REV *?= *//p' Makefile | tr -d ' ')
          echo "faiss=${RUNNER_OS}-faiss-${FAISS_REV}" >> "$GITHUB_OUTPUT"

      - name: Cache FAISS build
        uses: actions/cache@v5
        with:
          path: ~/.cache/faiss_ex
          key: ${{ steps.key.outputs.faiss }}

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix test --include slow
